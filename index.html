<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💜</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts -->
    <div class="hearts">
        <span>💜</span>
        <span>💗</span>
        <span>💜</span>
        <span>❤️</span>
        <span>💜</span>
        <span>💗</span>
    </div>


    <!-- Main content -->
    <main>

        <p class="tiny">
            nothing serious 😂
        </p>

        <h1>
            BABEY...
        </h1>

        <div class="heart">
            💜
        </div>

        <h2>
            I LOVE YOU.
        </h2>

        <p class="message">
            That's it. 😂
            <br>
            I just wanted to randomly remind you.
        </p>

        <button onclick="showMessage()">
            Okay bye 😂💜
        </button>


        <!-- Hidden message -->
        <div id="secret">

            <p>
                Actually wait...
            </p>

            <h3>
                I LOVE YOU MORE. 🥹💜
            </h3>

            <p>
                Now you can continue with your day. 😂
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
